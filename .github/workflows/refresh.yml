name: Refresh TFT deck data
on:
  push:
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/refresh.mjs'
      - 'data/champion_ids.json'
  schedule:
    - cron: '0 21 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/refresh.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-decks
          path: data/latest.json
      - name: Publish verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified TFT deck data'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
