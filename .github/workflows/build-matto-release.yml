name: Build signed Matto APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-matto-release.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode Matto signing key
        env:
          MATTO_KEYSTORE_BASE64: ${{ secrets.MATTO_KEYSTORE_BASE64 }}
        run: |
          test -n "$MATTO_KEYSTORE_BASE64"
          printf '%s' "$MATTO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/matto-release-key.p12"
          chmod 600 "$RUNNER_TEMP/matto-release-key.p12"
      - name: Build signed release APK
        env:
          MATTO_KEYSTORE_PATH: ${{ runner.temp }}/matto-release-key.p12
          MATTO_STORE_PASSWORD: ${{ secrets.MATTO_STORE_PASSWORD }}
          MATTO_KEY_ALIAS: ${{ secrets.MATTO_KEY_ALIAS }}
          MATTO_KEY_PASSWORD: ${{ secrets.MATTO_KEY_PASSWORD }}
        run: gradle :app:assembleMattoRelease --no-daemon
      - name: Name APK 마또 도우미.apk
        run: cp app/build/outputs/apk/matto/release/app-matto-release.apk "마또 도우미.apk"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: matto-release
          path: "마또 도우미.apk"
      - name: Publish to mobile release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload mobile-v1 "마또 도우미.apk" --clobber
