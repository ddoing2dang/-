name: Build Matto Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/matto/**'
      - 'scripts/bundle-web.cjs'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[mobile only]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restored app startup and interactions
        if: "!contains(github.event.head_commit.message, '[skip app tests]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build Matto
        working-directory: desktop/matto
        run: |
          npm install --no-audit --no-fund
          npm run dist:win-installer
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tft-desktop-installers
          path: |
            desktop/matto/release/*.exe
      - name: Publish public downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-v1 >/dev/null 2>&1 || gh release create desktop-v1 --title "마또 도우미 PC" --notes "마또 Windows 설치 파일."
          cp desktop/matto/release/*.exe "마또 도우미.exe"
          cp "마또 도우미.exe" Matto-Helper.exe
          powershell -NoProfile -Command "Compress-Archive -LiteralPath '마또 도우미.exe' -DestinationPath 'Matto-Helper.zip' -Force"
          cp Matto-Helper.exe Matto-Helper-1.7.2.exe
          gh release upload desktop-v1 Matto-Helper.exe Matto-Helper.zip Matto-Helper-1.7.2.exe --clobber

