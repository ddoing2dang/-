name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build both APKs
        run: gradle :app:assembleOriginalDebug :app:assembleMattoDebug --no-daemon
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tft-mobile-apks
          path: app/build/outputs/apk/*/debug/*.apk
      - name: Publish public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-v1 >/dev/null 2>&1 || gh release create mobile-v1 --title "TFT 모바일 앱" --notes "원본과 마또 앱 설치 파일. 최신 화면은 연결된 사이트에서 갱신됩니다."
          gh release upload mobile-v1 app/build/outputs/apk/original/debug/*.apk app/build/outputs/apk/matto/debug/*.apk --clobber
