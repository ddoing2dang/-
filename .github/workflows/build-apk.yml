name: Build Matto debug APK (manual testing only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle offline web apps
        run: |
          node scripts/bundle-web.cjs matto mobile app/src/matto/assets/web
      - name: Build Matto APK
        run: gradle :app:assembleMattoDebug --no-daemon
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tft-mobile-apks
          path: app/build/outputs/apk/matto/debug/*.apk
