<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>마또 미니 도우미</title><link rel="stylesheet" href="pc-mini.css"><script src="portrait-cache.js"></script><script src="portraits.js"></script><script src="pc-mini.js" defer></script></head>
<body>
 <header id="titlebar"><span class="grip" title="이 여백을 드래그하면 미니 창이 이동합니다">⠿ 드래그하여 이동</span><span class="apple" aria-hidden="true">🍎</span><select id="deckSelect" aria-label="미니 창에 표시할 추천덱"></select><span id="levelBadge"></span><button id="pin" type="button" aria-pressed="true" aria-label="항상 위 고정 켜짐" title="항상 위 고정 켜짐 · 눌러서 해제">📌</button><button id="collapse" title="한 줄로 접기" aria-label="한 줄로 접기">−</button><button id="close" title="미니 창 끄기" aria-label="미니 창 끄기">×</button></header>
 <main id="compact"><div id="roster" aria-label="전체 챔피언"></div><div class="bottom"><span id="priorityLabel">우선 아이템</span><div id="priorityIcons"></div><button id="expand" aria-expanded="false">상세보기 ›</button></div><div class="preferences"><label>투명도 <input id="opacity" aria-label="미니 창 투명도" type="range" min="65" max="100" value="100"></label><span id="patch"></span></div></main>
 <section id="detail" hidden><nav aria-label="상세 공략 탭"><button data-tab="levels" aria-selected="true">레벨별 TIP</button><button data-tab="items" aria-selected="false">아이템 우선순위</button><button data-tab="augments" aria-selected="false">추천 증강</button><button data-tab="tips" aria-selected="false">총 요약</button></nav><div id="content" tabindex="-1"></div><footer id="sourceNote"></footer></section>
 <p id="error" role="status" hidden></p>
</body></html>
