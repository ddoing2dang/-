plugins { id 'com.android.application' }

android {
    namespace 'kr.personal.tftguide'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.personal.tftguide'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('MATTO_KEYSTORE_PATH') ?: "$rootDir/matto-release-key.p12")
            storeType 'PKCS12'
            storePassword System.getenv('MATTO_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('MATTO_KEY_ALIAS') ?: 'matto'
            keyPassword System.getenv('MATTO_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    flavorDimensions 'theme'
    productFlavors {
        original {
            dimension 'theme'
            applicationIdSuffix '.original'
            resValue 'string', 'app_name', 'TFT 도우미'
            buildConfigField 'String', 'APP_URL', '"https://tft-board-mobile.dm26754899.chatgpt.site/"'
        }
        matto {
            dimension 'theme'
            applicationIdSuffix '.matto'
            resValue 'string', 'app_name', '마또 도우미'
            buildConfigField 'String', 'APP_URL', '"https://tft-matto-mobile.dm26754899.chatgpt.site/"'
        }
    }
    buildFeatures { buildConfig true }
}
